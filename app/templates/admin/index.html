{% extends "base.html" %}

{% block page_title %}Admin Portal & Audit Log Viewer{% endblock %}

{% block content %}
<div class="admin-workspace">
    <div class="card">
        <div class="card-header">
            <h3>System Audit Logs</h3>
        </div>
        <div class="card-body p-0">
            <table class="table" id="admin-audit-table">
                <thead>
                    <tr>
                        <th>Timestamp</th>
                        <th>User ID</th>
                        <th>Action</th>
                        <th>Resource</th>
                        <th>Details</th>
                    </tr>
                </thead>
                <tbody id="admin-audit-tbody">
                    <!-- Rendered by adminModule.js -->
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{{ url_for('static', filename='js/modules/adminModule.js') }}"></script>
{% endblock %}
