<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TripPilot SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <span class="logo-icon">✈️</span>
            <h2>Welcome Back to TripPilot</h2>
            <p>Sign in to manage your itineraries, group budgets & trips</p>
        </div>

        <form id="form-login" class="auth-form">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="login-username" class="form-control" placeholder="e.g. alex_traveler" required value="alex_traveler">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="Traveler@123">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('main.register') }}">Create one</a></p>
            <p class="demo-hint">Demo Accounts: <code>alex_traveler / Traveler@123</code> or <code>admin / Admin@123</code></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
