<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - TripPilot SaaS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="auth-header">
            <span class="logo-icon">✈️</span>
            <h2>Create Your TripPilot Account</h2>
            <p>Start planning your next adventure in minutes</p>
        </div>

        <form id="form-register" class="auth-form">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-fullname" class="form-control" placeholder="Alex Morgan" required>
            </div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="reg-username" class="form-control" placeholder="alex_m" required>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" class="form-control" placeholder="alex@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">Create Free Account</button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('main.login') }}">Sign In</a></p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
